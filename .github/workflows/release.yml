name: Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      HAS_KEY: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "xcpe-guard-1.0.${VERSION_CODE}.apk"
          cp app/build/outputs/apk/release/app-release.apk xcpe-guard.apk
          sha256sum xcpe-guard.apk > xcpe-guard.apk.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: xcpe-guard-1.0.${{ github.run_number }}
          path: xcpe-guard*.apk

      - name: Missing signing key
        if: env.HAS_KEY != 'true'
        run: |
          echo "::warning::KEYSTORE_BASE64 is not set. The APK was built with a throwaway debug key and uploaded as an artifact only; no release was published, because updates need the same key every time."

      - name: Publish release
        if: env.HAS_KEY == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: XCPE Guard 1.0.${{ github.run_number }}
          make_latest: true
          generate_release_notes: true
          files: |
            xcpe-guard.apk
            xcpe-guard-1.0.${{ github.run_number }}.apk
            xcpe-guard.apk.sha256
